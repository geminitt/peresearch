<text x="28.0" y="42.0" font-family="'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F1F1F" text-anchor="start">Storage frame: what peresearch keeps, and for whom</text>
<text x="28.0" y="68.0" font-family="'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5A5A55" text-anchor="start">Everything lives in $PERESEARCH_HOME (default ~/.local/share/peresearch), a folder only the user may enter (guard.ensure_home, at every command). working tree on 5ca550a, 2026-10-12.</text>
